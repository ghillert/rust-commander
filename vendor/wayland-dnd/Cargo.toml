[package]
name = "rust-commander-wayland-dnd"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
raw-window-handle = "0.6"
libc = "0.2"
sctk = { package = "smithay-client-toolkit", version = "0.20.0", default-features = false, features = ["calloop"] }
wayland-backend = { version = "0.3.5", default-features = false, features = ["client_system", "dlopen"] }
