[package]
name = "rust-commander"
version = "0.8.0-rc.1"
edition = "2024"
rust-version = "1.92"
description = "A native Rust dual-pane file manager inspired by muCommander"
license = "GPL-3.0-only"

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "renderer-software", "accessibility", "compat-1-18", "unstable-winit-030", "raw-window-handle-06"] }
anyhow = "1"
# Reuse existing transitive packages for file-backed single-request uploads.
bytes = "1"
memmap2 = "0.9"
encoding_rs = "0.8"
quick-xml = "0.38"
shlex = "1.3"
unicode-normalization = "0.1"
chrono = "0.4"
compress-tools = "0.16"
directories = "6"
flate2 = "1"
bzip2 = "0.5"
globset = "0.4"
hayro = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "tiff", "ico"] }
md-5 = "0.10"
libc = "0.2"
notify = "8"
# Select storage services explicitly; the reqwest dependency below retains Rustls TLS.
opendal = { version = "0.54", default-features = false, features = ["executors-tokio", "blocking", "services-fs", "services-ftp", "services-webdav", "services-s3", "services-http", "services-dropbox", "services-gdrive", "services-onedrive", "services-gcs", "services-webhdfs"] }
percent-encoding = "2"
portable-pty = "0.9"
regex = "1"
sevenz-rust = { version = "0.6", features = ["aes256"] }
sha1 = "0.10"
xz2 = "0.1"
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
trash = "5"
tokio = { version = "1", features = ["rt-multi-thread"] }
url = "2"
vt100 = "0.15"
zip = { version = "2.4", default-features = false, features = ["deflate", "bzip2", "aes-crypto"] }

# File and text clipboard support; image previews use the image dependency directly.
clipboard-rs = { version = "0.3.5", default-features = false, features = ["wayland"] }
raw-window-handle = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rand = "0.8"
sys-locale = "0.3"
filetime = "0.2"
same-file = "1"
base64 = "0.22"
smb2 = "=0.27.0"

[target.'cfg(unix)'.dependencies]
# OpenDAL SFTP uses the Unix-only openssh transport.
opendal = { version = "0.54", default-features = false, features = ["services-sftp"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
drag = "2.1.1"

[features]
screenshot = []

[profile.release]
# Keep all features and panic recovery; favor a smaller distributed executable.
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"

[[bin]]
name = "rust-commander"
path = "src/main.rs"

[target.'cfg(target_os = "macos")'.dependencies]
# Disable Slint's default AppKit menu in favor of our localized command menus.
i-slint-backend-winit = { version = "=1.18.1", default-features = false }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow", "NSView", "NSResponder", "NSButton", "NSControl"] }
keyring = { version = "3", features = ["apple-native"] }
muda = { version = "0.21", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Foundation", "Win32_Security"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", default-features = false }
gtk4 = {version="0.10.3", default-features=false, features=["v4_8"]}
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

# Upstream drag 2.1.1 locks unused GTK3/GLib dependencies. Linux uses our GTK4
# helper; retain only the unchanged native macOS/Windows backends here.
[patch.crates-io]
drag = { path = "vendor/drag" }

[build-dependencies]
winresource = "0.1"
slint-build = { version = "=1.18.1", default-features = false, features = ["compat-1-18"] }

[dev-dependencies]
i-slint-backend-testing = "=1.18.1"
