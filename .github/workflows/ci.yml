name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  build:
    name: Test and build (${{ matrix.os }})
    needs: format
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libarchive-dev libdbus-1-dev libgtk-4-dev \
            libx11-dev libxfixes-dev libxi-dev libxrandr-dev libxcursor-dev libxinerama-dev \
            libgl1-mesa-dev libxkbcommon-dev libwayland-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install libarchive pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix libarchive)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install libarchive:x64-windows-static-md
            $installExitCode = $LASTEXITCODE
            if ($installExitCode -eq 0) { break }
            if ($attempt -lt 3) { Start-Sleep -Seconds (10 * $attempt) }
          }
          if ($installExitCode -ne 0) { exit $installExitCode }
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          "VCPKGRS_TRIPLET=x64-windows-static-md" >> $env:GITHUB_ENV

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets

      - name: Build release executable
        run: cargo build --locked --release

      - name: Package Linux executable
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp target/release/rust-commander LICENSE NOTICE dist/
          tar -czf "dist/rust-commander-${RUNNER_OS}-${RUNNER_ARCH}.tar.gz" \
            -C dist rust-commander LICENSE NOTICE

      - name: Package macOS application
        if: runner.os == 'macOS'
        run: |
          ./scripts/package-macos.sh
          codesign --verify --deep --strict "target/release/Rust Commander.app"
          mkdir -p dist
          tar -czf "dist/rust-commander-${RUNNER_OS}-${RUNNER_ARCH}.tar.gz" \
            -C target/release "Rust Commander.app"

      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "target/release/rust-commander.exe", "LICENSE", "NOTICE" `
            -DestinationPath "dist/rust-commander-$env:RUNNER_OS-$env:RUNNER_ARCH.zip"

      # Tar archives preserve Unix executable permissions and the app bundle.
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: rust-commander-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
