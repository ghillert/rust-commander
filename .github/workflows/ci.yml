name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  build:
    name: Test and build (${{ matrix.os }})
    needs: format
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
      - uses: ./.github/actions/checks
      - uses: ./.github/actions/packaging-tools
        if: runner.os == 'macOS'

      - name: Build release executable
        run: cargo build --locked --release

      - name: Package Linux executable
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp target/release/rust-commander LICENSE NOTICE dist/
          tar -czf "dist/rust-commander-${RUNNER_OS}-${RUNNER_ARCH}.tar.gz" \
            -C dist rust-commander LICENSE NOTICE

      - name: Package macOS application
        if: runner.os == 'macOS'
        run: |
          ./scripts/package-macos.sh
          codesign --verify --deep --strict "target/release/Rust Commander.app"
          mkdir -p dist
          tar -czf "dist/rust-commander-${RUNNER_OS}-${RUNNER_ARCH}.tar.gz" \
            -C target/release "Rust Commander.app"

      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "target/release/rust-commander.exe", "LICENSE", "NOTICE" `
            -DestinationPath "dist/rust-commander-$env:RUNNER_OS-$env:RUNNER_ARCH.zip"

      # Tar archives preserve Unix executable permissions and the app bundle.
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: rust-commander-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
