name: Native build environment
description: Shared native dependencies, Python and Rust toolchain
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential pkg-config libarchive-dev libdbus-1-dev libgtk-4-dev libfontconfig1-dev \
          libx11-dev libxfixes-dev libxi-dev libxrandr-dev libxcursor-dev libxinerama-dev \
          libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
          xvfb xauth xclip dbus-x11 patchelf libfuse2t64

    - name: Install macOS dependencies
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install libarchive pkg-config
        echo "MACOSX_DEPLOYMENT_TARGET=15.0" >> "$GITHUB_ENV"
        echo "RUSTFLAGS=-C link-arg=-Wl,-headerpad_max_install_names" >> "$GITHUB_ENV"
        echo "PKG_CONFIG_PATH=$(brew --prefix libarchive)/lib/pkgconfig" >> "$GITHUB_ENV"

    - name: Install Windows dependencies
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        # vcpkg does not retry every curl DNS/download failure itself.
        for ($attempt = 1; $attempt -le 3; $attempt++) {
          Write-Host "Installing Windows dependencies (attempt $attempt/3)"
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install libarchive:x64-windows-static-md
          $installExitCode = $LASTEXITCODE
          if ($installExitCode -eq 0) { break }
          if ($attempt -lt 3) {
            Write-Warning "vcpkg failed with exit code $installExitCode; retrying."
            Start-Sleep -Seconds (10 * $attempt)
          }
        }
        if ($installExitCode -ne 0) { exit $installExitCode }
        "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
        "VCPKGRS_TRIPLET=x64-windows-static-md" >> $env:GITHUB_ENV

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy,rustfmt

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        key: native-${{ runner.os }}-${{ runner.arch }}
        cache-on-failure: true
