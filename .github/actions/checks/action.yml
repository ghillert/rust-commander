name: Application checks
description: Shared formatting, tests, Clippy, and platform integration checks
runs:
  using: composite
  steps:
    - name: Validate vendored icon catalog
      shell: bash
      run: python scripts/tests/test_icons.py
    - name: Check release automation
      shell: bash
      run: python scripts/release/tests/test_release.py
    - name: Check formatting
      shell: bash
      run: cargo fmt --all -- --check
    - name: Run Clippy
      shell: bash
      run: cargo clippy --locked --all-targets --all-features -- -D warnings

    - name: Run tests
      shell: bash
      run: cargo test --locked --all-targets --all-features

    - name: Test disposable real remote services
      if: runner.os == 'Linux'
      shell: bash
      run: python3 scripts/test-remote.py

    - name: Test native URI transports (FTP, both FTPS modes, Rust SFTP)
      shell: bash
      run: |
        python -m pip install --disable-pip-version-check -r scripts/uri-fixtures/requirements.txt
        python scripts/test-uri-transports.py

    - name: Test native Linux clipboard and drag source
      if: runner.os == 'Linux'
      shell: bash
      run: |
        xvfb-run -a dbus-run-session -- bash -e <<'NATIVE_TESTS'
        printf '%s' 'Disposable Rust Commander CI clipboard' | xclip -selection clipboard
        cargo test --locked --all-features --test features native_clipboard_copy_cut_and_external_change_round_trip -- --ignored --exact --test-threads=1
        cargo test --locked --all-features --lib gtk_native_drag_source_exposes_file_list -- --ignored --test-threads=1
        cargo test --locked --all-features --lib native_file_icons_load_on_the_worker -- --ignored --test-threads=1
        NATIVE_TESTS

    - name: Test native Windows clipboard
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Set-Clipboard -Value 'Disposable Rust Commander CI clipboard'
        cargo test --locked --all-features --test features native_clipboard_copy_cut_and_external_change_round_trip -- --ignored --exact --test-threads=1
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Test native AppKit and OLE deferred file providers
      if: runner.os != 'Linux'
      shell: bash
      run: cargo test --locked -p rust-commander-native-dnd-tests -- --test-threads=1

    - name: Test native X11 and Wayland drag protocols
      if: runner.os == 'Linux'
      shell: bash
      run: ./scripts/test-native-dnd.sh

    - name: Smoke test both desktop renderers
      if: runner.os == 'Linux'
      env:
        LIBGL_ALWAYS_SOFTWARE: '1'
      shell: bash
      run: |
        cargo build --locked --features screenshot
        xvfb-run -a -s '-screen 0 3200x2200x24' dbus-run-session -- python3 scripts/desktop-smoke.py --scale 1 --scale 1.25 --scale 1.5 --scale 2
        xvfb-run -a dbus-run-session -- python3 scripts/icon-smoke.py --quick
        xvfb-run -a dbus-run-session -- python3 scripts/uri-smoke.py
        xvfb-run -a dbus-run-session -- python3 scripts/progress-smoke.py

    - name: Test native macOS operation forms
      if: runner.os == 'macOS'
      shell: bash
      run: |
        cargo build --locked --features screenshot
        python3 scripts/native-extract-smoke.py
        python3 scripts/native-operation-smoke.py

    - name: Smoke test Windows software rendering at common scales
      if: runner.os == 'Windows'
      shell: bash
      run: |
        cargo build --locked --features screenshot
        python scripts/desktop-smoke.py --renderer software --scale 1 --scale 1.25 --scale 1.5 --scale 2

    - name: Test optimized transfer recovery
      shell: bash
      run: cargo test --release --locked --jobs 1 --test stabilization --test features_08

    - name: Upload stabilization reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: stabilization-reports-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ github.run_attempt }}
        path: |
          target/remote-service-logs/*.log
          target/uri-transport-logs/*.log
          target/desktop-smoke/*.png
          target/desktop-smoke/*.log
          target/icon-smoke/*.png
          target/icon-smoke/*.log
          target/uri-smoke/*.png
          target/uri-smoke/*.log
          target/progress-smoke/*.png
          target/progress-smoke/*.log
          target/native-dnd-logs/*.log
          target/native-extract-smoke/*.png
          target/native-extract-smoke/*.log
          target/native-operation-smoke/*.png
          target/native-operation-smoke/*.log
        if-no-files-found: ignore
        retention-days: 7
