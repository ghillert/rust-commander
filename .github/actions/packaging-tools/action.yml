name: Desktop packaging tools
description: Install the pinned cargo-packager without adding application dependencies
runs:
  using: composite
  steps:
    - name: Cache cargo-packager
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/.cargo/bin/cargo-packager*
        key: cargo-packager-0.11.8-${{ runner.os }}-${{ runner.arch }}
    - name: Install cargo-packager
      shell: bash
      run: |
        if [ "$(cargo-packager --version 2>/dev/null || true)" != 'cargo-packager 0.11.8' ]; then
          cargo install cargo-packager --version 0.11.8 --locked --force
        fi
    - name: Check cargo-packager version
      shell: bash
      run: cargo-packager --version
