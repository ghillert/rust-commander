[package]
name = "rust-commander-native-dnd-tests"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false
license = "GPL-3.0-only"

[target.'cfg(target_os = "linux")'.dependencies]
anyhow = "1"
url = "2"
x11rb = { version = "0.13", default-features = false, features = ["xtest"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
drag = { path = "../../vendor/drag" }
tempfile = "3"

[target.'cfg(target_os = "windows")'.dependencies]
dunce = "1"
raw-window-handle = "0.6"
windows = {version="0.52",features=["implement","Win32_Foundation","Win32_Graphics_Gdi","Win32_System_Com", "Win32_System_Threading", "Win32_Security","Win32_System_Com_StructuredStorage","Win32_System_Ole","Win32_System_Memory","Win32_System_SystemServices","Win32_UI_Shell","Win32_UI_Shell_Common","Win32_UI_WindowsAndMessaging","Win32_Graphics_Imaging","Win32_System_DataExchange"]}

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = {version="0.3",features=["NSFilePromiseProvider","NSPasteboard","NSDraggingItem","block2"]}
objc2-foundation = {version="0.3",features=["NSError","NSOperation","NSURL"]}
block2 = "0.6"

[[test]]
name = "appkit-promises"
path = "appkit-promises.rs"
harness = false
